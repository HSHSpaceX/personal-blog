<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动态 - 拾光手记</title>
  <meta name="description" content="拾光手记的短动态,一些不成文章的即时想法。">
  <link rel="icon" href="assets/icon.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="stylesheet" href="css/admin.css?v=2">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('blog-theme') || 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }</script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="拾光手记首页">
        <span class="brand-mark" aria-hidden="true"><img src="assets/icon.jpg" alt=""></span>
        <span class="brand-name">拾光手记</span>
      </a>
      <nav class="site-nav" id="siteNav" aria-label="主导航">
        <a class="nav-link" href="index.html">首页</a>
        <a class="nav-link" href="archive.html">归档</a>
        <a class="nav-link" href="timeline.html">时间线</a>
        <a class="nav-link" href="gallery.html">画廊</a>
        <a class="nav-link active" href="moments.html">动态</a>
        <a class="nav-link" href="about.html">关于</a>
      </nav>
      <div class="header-actions">
        <a class="btn-login" href="login.html">登录</a>
        <span class="user-menu-wrap" hidden>
          <button class="user-avatar" type="button" aria-label="账号菜单" aria-haspopup="true" aria-expanded="false">
            <img src="assets/icon.jpg" alt="">
            <span class="menu-badge" hidden></span>
          </button>
          <div class="user-menu" hidden>
            <a class="user-menu-item" href="admin.html#messages">消息 <span class="menu-badge" hidden></span></a>
            <a class="user-menu-item" href="admin.html">管理后台</a>
            <button class="user-menu-item" type="button" data-logout>退出登录</button>
          </div>
        </span>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="切换深色模式" title="切换深色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn menu-btn" id="menuToggle" type="button" aria-label="打开菜单" title="菜单" aria-expanded="false" aria-controls="siteNav">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="band" id="momentConnect" hidden>
      <div class="container">
        <div class="admin-card">
          <h2>连接 GitHub</h2>
          <p class="hint">发布动态需要 GitHub 授权,连接一次即可。Token 只保存在当前设备浏览器中。</p>
          <div class="field">
            <label for="momentTokenInput">GitHub Token</label>
            <input id="momentTokenInput" type="password" placeholder="ghp_… 或 github_pat_…" autocomplete="off">
          </div>
          <div class="admin-row">
            <button class="btn primary" id="momentConnectBtn" type="button">连接</button>
            <a class="btn" href="https://github.com/settings/tokens/new?scopes=public_repo&amp;description=blog-moments" target="_blank" rel="noopener">创建 Token</a>
          </div>
          <p id="momentConnectStatus" class="status-line"></p>
        </div>
      </div>
    </section>

    <section class="page-head band">
      <div class="container">
        <p class="eyebrow">MOMENTS</p>
        <h1>动态</h1>
        <p class="intro-text">一些不成文章的即时想法。</p>
      </div>
    </section>

    <section class="band">
      <div class="container moment-container">
        <div class="composer" id="composer" hidden>
          <img class="moment-avatar" src="assets/icon.jpg" alt="">
          <div class="composer-body">
            <textarea id="composerText" rows="3" maxlength="2000" placeholder="有什么新鲜事?"></textarea>
            <div class="composer-preview" id="composerPreview" hidden></div>
            <div class="composer-bar">
            <button class="icon-btn" id="composerImgBtn" type="button" aria-label="添加图片或视频" title="添加图片或视频">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
              <span class="status-line" id="composerStatus"></span>
              <button class="btn primary" id="composerPost" type="button">发布</button>
            </div>
          </div>
        </div>
        <div class="moment-list" id="momentList"></div>
        <p class="status-line" id="momentStatus"></p>
      </div>
    </section>
  </main>

  <input id="momentFileInput" type="file" accept="image/*,video/*" multiple hidden>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> 拾光手记</p>
      <p>保留所有权利</p>
      <div class="footer-links">友情链接：<a href="https://www.kechuang.org/" target="_blank" rel="noopener">科创</a><span class="footer-sep"> | </span><a href="https://vanyu0710.github.io/aicad/" target="_blank" rel="noopener">Varen CAD</a></div>
      <a class="footer-link" href="login.html">管理</a>
    </div>
  </footer>

  <script src="js/boot.js?v=2"></script>
  <script src="js/site.js?v=2"></script>
  <script src="js/moments-page.js?v=2"></script>
</body>
</html>
