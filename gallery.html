  <main id="main">
    <section class="page-head band">
      <div class="container gallery-head">
        <div>
          <p class="eyebrow">GALLERY</p>
          <h1>画廊</h1>
          <p class="intro-text">用照片记录生活，按图册整理。</p>
        </div>
        <button class="icon-btn gallery-plus" id="galleryPlus" type="button" aria-label="创建图册" title="创建图册" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </section>

    <section class="band gallery-band">
      <div class="container">
        <div id="galleryConnect" class="admin-card" hidden>
          <h2>连接 GitHub</h2>
          <p class="hint">管理图册需输入 Fine-grained PAT；只在当前页面内存中保留。</p>
          <div class="field"><label for="galleryTokenInput">GitHub PAT</label><input id="galleryTokenInput" data-github-pat type="password" placeholder="github_pat_…" autocomplete="off"></div>
          <div class="admin-row"><button class="btn primary" id="galleryConnectBtn" type="button">连接</button></div>
          <p id="galleryConnectStatus" class="status-line"></p>
        </div>
        <div id="galleryGrid" class="album-grid"></div>
        <div id="albumView" class="album-view" hidden>
          <div class="album-view-head">
            <a class="text-link" href="gallery.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
              返回画廊
            </a>
            <div class="album-view-actions" id="albumActions" hidden></div>
          </div>
          <h2 id="albumTitle" class="album-view-title"></h2>
          <div id="albumMeta" class="album-meta"></div>
          <div id="photoGrid" class="photo-grid"></div>
        </div>
        <p id="galleryStatus" class="status-line"></p>
      </div>
    </section>
  </main>

  <div class="gallery-modal" id="albumModal" hidden>
    <div class="gallery-modal-card">
      <h2>创建图册</h2>
      <div class="field">
        <label for="albumTitleInput">图册名称</label>
        <input id="albumTitleInput" type="text" placeholder="例如：2026 夏日旅行">
      </div>
      <div class="field">
        <label for="albumVisibility">可见性</label>
        <select id="albumVisibility">
          <option value="public">公开 - 所有人可见</option>
          <option value="private">仅我可见 - 需登录</option>
        </select>
      </div>
      <div class="admin-row">
        <button class="btn primary" id="albumCreateBtn" type="button">创建</button>
        <button class="btn" id="albumCancelBtn" type="button">取消</button>
      </div>
      <p id="albumModalStatus" class="status-line"></p>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-btn lightbox-close" id="lightboxClose" type="button" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <img id="lightboxImg" alt="">
    <div class="lightbox-caption" id="lightboxCaption"></div>
    <div class="lightbox-counter" id="lightboxCounter"></div>
    <div class="lightbox-controls">
      <button class="lightbox-btn" id="lightboxPrev" type="button" aria-label="上一张">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="lightbox-btn" id="lightboxPlay" type="button" aria-label="幻灯片播放">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button class="lightbox-btn" id="lightboxNext" type="button" aria-label="下一张">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <input id="galleryFileInput" type="file" accept="image/*" multiple hidden>

  <div class="album-menu" id="albumMenu" hidden>
    <button type="button" data-action="rename">重命名</button>

    <button type="button" data-action="down">下移</button>
