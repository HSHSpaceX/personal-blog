name: Submit IndexNow URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Submit canonical sitemap URLs after deployment
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
