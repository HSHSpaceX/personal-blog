name: Community permissions and regression
on:
  push:
    branches: [main, feature/community-v2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PostgreSQL engines and DOM test runtime
        run: |
          npm install --prefix /tmp/blog-rls --ignore-scripts --no-save --no-audit --no-fund @electric-sql/pglite@0.3.14 pg@8.16.3 @embedded-postgres/linux-x64@18.4.0-beta.17 jsdom@26.1.0
          cd /tmp/blog-rls/node_modules/@embedded-postgres/linux-x64
          node scripts/hydrate-symlinks.js
      - name: Generate and validate static site
        run: |
          node scripts/generate-site.mjs
          node scripts/check-seo.mjs
          node scripts/check-secrets.mjs
          git diff --check
      - name: Run all regression and PostgreSQL permission tests
        env:
          PGLITE_MODULE: file:///tmp/blog-rls/node_modules/@electric-sql/pglite/dist/index.js
          PG_TEST_BIN: /tmp/blog-rls/node_modules/@embedded-postgres/linux-x64/native/bin
          PG_TEST_LIB: /tmp/blog-rls/node_modules/@embedded-postgres/linux-x64/native/lib
          PG_TEST_MODULE: file:///tmp/blog-rls/node_modules/pg/lib/index.js
          COMMUNITY_DOM_MODULE: file:///tmp/blog-rls/node_modules/jsdom/lib/api.js
        run: node --test tests/*.test.cjs tests/*.test.mjs
