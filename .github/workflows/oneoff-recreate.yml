name: One-off: Recreate Austria Article
on:
  workflow_dispatch:

jobs:
  recreate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy script and backup to workspace
        run: |
          cp scripts/oneoff-recreate-article.mjs /tmp/recreate-article.mjs
          cp data/backup-austria.json /tmp/backup_full.json
      - name: Run recreate script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node /tmp/recreate-article.mjs
      - name: Trigger sync workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Sync approved Community public state" --ref main
