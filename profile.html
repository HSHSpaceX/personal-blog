<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>用户资料 - 拾光手记</title>
  <meta name="description" content="查看和编辑拾光手记用户资料。">
  <link rel="icon" href="assets/icon.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="stylesheet" href="css/admin.css?v=2">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('blog-theme') || 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }</script>
</head>
<body>
  <header class="site-header"><div class="container header-inner">
    <a class="brand" href="index.html"><span class="brand-mark"><img src="assets/icon.jpg" alt=""></span><span class="brand-name">拾光手记</span></a>
    <div class="header-actions"><a class="btn" href="index.html">返回首页</a><button class="icon-btn" id="themeToggle" type="button" aria-label="切换深色模式">◐</button></div>
  </div></header>
  <main class="admin-main container">
    <section class="admin-card wide">
      <h1 id="profileHeading">用户资料</h1>
      <p id="profileStatus" class="status-line" aria-live="polite"></p>
      <div class="profile-summary"><img id="profileAvatar" src="assets/avatar-default.jpg" alt="用户头像" width="96" height="96"><div><h2 id="profileName"></h2><p id="profileUsername"></p><p id="profileBio"></p></div></div>
      <p id="profileCounts"></p>
      <div class="admin-row"><button class="btn primary" id="followBtn" type="button" hidden>关注</button><a class="btn" id="adminLink" href="admin.html" hidden>管理后台</a><button class="btn" id="profileLogout" type="button" hidden>退出</button></div>
    </section>
    <section class="admin-card wide" id="profileEditor" hidden>
      <h2>编辑我的资料</h2>
      <div class="field"><label for="profileUsernameInput">用户名（3–30 个英文、数字或下划线）</label><input id="profileUsernameInput" maxlength="30" autocomplete="nickname"></div>
      <div class="field"><label for="profileDisplayInput">显示名称</label><input id="profileDisplayInput" maxlength="80"></div>
      <div class="field"><label for="profileBioInput">简介</label><textarea id="profileBioInput" maxlength="500" rows="4"></textarea></div>
      <div class="field"><label for="profileAvatarInput">头像（JPG、PNG、WebP，最多 2 MB）</label><input id="profileAvatarInput" type="file" accept="image/jpeg,image/png,image/webp"></div>
      <div class="admin-row"><button class="btn primary" id="profileSave" type="button">保存资料</button></div>
    </section>
  </main>
  <script src="js/config.js?v=3"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="js/blog-data.js?v=3"></script>
  <script src="js/profile.js?v=3"></script>
</body>
</html>
